<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0f1c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="الإرجاع">
<title>نظام إرجاع الطلبيات</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
:root{color-scheme:dark;--navy:#0a0f1c;--pr:#3b82f6;--prb:#2563eb;--pr2:#1b2a4a;--ok:#10b981;--okb:#059669;--ok2:#0e2a24;--er:#f87171;--erb:#dc2626;--er2:#2c1a20;--wr:#f59e0b;--wr2:#2c2412;--bg:#0f1523;--card:#171f30;--in:#0f1523;--tx:#e6ebf5;--mu:#97a3b8;--bd:#273248}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:70px}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* top bar */
.top{background:var(--navy);border-bottom:1px solid var(--bd);color:#fff;position:sticky;top:0;z-index:10;padding-top:env(safe-area-inset-top,0px)}
.top .in{max-width:1000px;margin:auto;display:flex;align-items:center;gap:24px;padding:0 18px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:.2px}
.brand .lg{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);display:grid;place-items:center}
.tabs{display:none;gap:4px;margin-inline-start:auto}
.tact{display:flex;gap:8px;margin-inline-start:auto}
.tb2{width:42px;height:42px;padding:0;border-radius:11px;background:#ffffff14;color:#fff;border:1px solid #ffffff1f}.tb2.pri{background:var(--prb);border-color:transparent}.tb2.act{box-shadow:0 0 0 3px #3b82f64d}
#rp{display:none;background:#121a2c;border-top:1px solid #ffffff14}#rp.on{display:block}.rpi{max-width:1000px;margin:auto;padding:12px 18px 14px}.rpi .row button{flex:1}
.tabs a{display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:9px;color:#a9b8d6;cursor:pointer;font-weight:600;font-size:14px}
.tabs a.on{background:#ffffff1c;color:#fff}
main{max-width:1000px;margin:auto;padding:18px}
.page{display:none}.page.on{display:block}
.ttl{display:flex;align-items:center;justify-content:space-between;margin:2px 0 14px;gap:10px;flex-wrap:wrap}
.ttl h2{margin:0;font-size:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 1px 2px #0006}
.card h3{margin:0 0 14px;font-size:15px;color:var(--tx);display:flex;align-items:center;gap:8px}
.card h3 svg{color:var(--pr)}
/* stats */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;position:relative;overflow:hidden;box-shadow:0 1px 2px #0006}
.st:before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--c)}
.st .l{color:var(--mu);font-size:13px;font-weight:600}
.st .v{font-size:30px;font-weight:700;margin-top:6px;line-height:1.1}
.st .s{color:var(--mu);font-size:12.5px;margin-top:4px}
/* controls */
button{font:inherit;font-weight:600;border:1px solid transparent;border-radius:10px;padding:10px 16px;cursor:pointer;background:var(--prb);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.15s}
button:active{transform:scale(.98)}
button.o{background:var(--card);color:var(--tx);border-color:#34405a}
button.ok{background:var(--okb)}button.er{background:var(--erb)}button.wa{background:#15803d}
button.sm{padding:7px 12px;font-size:13px;border-radius:9px}
button.ic{padding:7px;border-radius:9px;background:var(--card);color:var(--mu);border-color:#34405a}
label{display:block;font-size:13px;font-weight:600;color:var(--mu);margin-bottom:6px}
input,select,textarea{font:inherit;width:100%;padding:11px 12px;border:1px solid #34405a;border-radius:10px;background:var(--in);color:var(--tx);outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--pr);box-shadow:0 0 0 3px #3b82f633}
textarea{min-height:140px;direction:ltr;text-align:left;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
.acts{display:flex;gap:10px;margin-bottom:16px}.acts button{flex:1;padding:13px}
.row{display:flex;gap:10px}.ic2{padding:0 13px}.row input{flex:1}
.grid2{display:grid;gap:16px}
/* result */
.res{border-radius:12px;padding:14px;margin-top:12px;border:1px solid}
.res.ok{background:var(--ok2);border-color:#14513f}.res.er{background:var(--er2);border-color:#5b2530}.res.wr{background:var(--wr2);border-color:#58421a}
.res dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0 0 12px}
.res dt{color:var(--mu)}.res dd{margin:0;font-weight:600}
/* late table */
.tb{width:100%;border-collapse:collapse}
.tb th{text-align:start;font-size:12.5px;color:var(--mu);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--bd)}
.tb td{padding:12px 10px;border-bottom:1px solid var(--bd)}
.tb tr:last-child td{border:0}
.pill{display:inline-block;min-width:32px;text-align:center;padding:3px 10px;border-radius:20px;font-weight:700;font-size:13px;background:var(--er2);color:var(--er)}
.empty{color:var(--mu);padding:8px 0;text-align:center}
/* distributors */
.dg{display:grid;gap:10px}
.dc{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:11px 12px;box-shadow:0 1px 2px #0006}
.dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;gap:8px}.dbt{display:flex;gap:6px}.dbt .ic{padding:6px;width:32px;height:32px}.dbt svg{width:17px;height:17px}.wa2{color:#22c55e!important}
.dh b{font-size:15px;display:flex;align-items:center;gap:10px}
.av{width:30px;height:30px;font-size:14px;border-radius:50%;background:var(--pr2);color:var(--pr);display:grid;place-items:center;font-weight:700}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.nums div{background:var(--bg);border-radius:9px;padding:6px 2px;text-align:center}
.nums b{display:block;font-size:17px;line-height:1.2}
.nums span{font-size:11px;color:var(--mu);font-weight:600}
.pg{height:5px;background:#26314a;border-radius:5px;overflow:hidden;margin:4px 0 0}
.pg i{display:block;height:100%;background:var(--pr);border-radius:6px}
.pm{display:flex;justify-content:space-between;font-size:12px;color:var(--mu)}.pm b{color:var(--tx)}.bars{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:9px}.mu2{font-size:12px;color:var(--mu);margin-top:6px}.mu2 b{color:var(--er)}
details{margin-top:8px;border-top:1px solid var(--bd);padding-top:7px}
summary{cursor:pointer;font-weight:600;font-size:13.5px;color:var(--tx)}
.ld{margin:0;padding:11px 0;border-top:0;border-bottom:1px solid var(--bd)}.ld:last-child{border-bottom:0;padding-bottom:2px}
.ld summary{display:flex;align-items:center;gap:10px;font-size:15px}.ld summary b{flex:1}
.ld .codes{padding:10px 4px 2px}
.dd{margin-top:6px;border:1px solid var(--bd);border-radius:9px;padding:7px 10px}
.dd summary{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px}
.dd .dm{color:var(--mu);font-weight:500;white-space:nowrap}.dd .dm b{color:var(--tx)}
.dd.lt{border-color:#5b2530;background:var(--er2)}.dd.lt i{font-style:normal;color:var(--er);font-weight:700;margin-inline-start:4px}
.codes{direction:ltr;text-align:left;font:12px/1.9 ui-monospace,Menlo,Consolas,monospace;color:var(--mu);word-break:break-all;margin-top:8px}
/* bottom nav */
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:flex;border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px;font-size:11.5px;color:var(--mu);font-weight:600;cursor:pointer}
nav a.on{color:var(--pr)}
/* toast */
#toast{position:fixed;top:calc(70px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-14px);opacity:0;pointer-events:none;z-index:40;background:#1e2840;border:1px solid var(--bd);border-inline-start:5px solid var(--c,#999);border-radius:12px;padding:13px 18px;box-shadow:0 10px 30px #000a;font-weight:600;width:calc(100% - 28px);max-width:420px;display:flex;gap:10px;align-items:center;transition:.2s}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast svg{color:var(--c)}
/* scanner */
#sov{display:none;position:fixed;inset:0;background:#050b1a;z-index:30;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px))}
#sov.on{display:flex}
.sh{display:flex;align-items:center;justify-content:space-between;color:#fff;font-weight:700;margin-bottom:12px}
#rd{min-height:240px;width:100%;max-width:520px;margin:auto;border-radius:16px;overflow:hidden;background:#000}
#sm{margin:14px auto 0;max-width:520px;width:100%;min-height:54px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;color:#fff;background:#ffffff14;padding:10px;direction:ltr}
.hide{display:none!important}
#rd video{width:100%;display:block}.sf{color:#fff;text-align:center;padding:36px 18px}.sf svg{width:34px;height:34px;color:#fbbf24}.sf p{line-height:1.8;font-weight:600}
#md{display:none;position:fixed;inset:0;background:#000b;z-index:50;align-items:center;justify-content:center;padding:18px}
#md.on{display:flex}.mb{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;width:100%;max-width:380px}
.mb p{margin:0 0 12px;font-weight:600;line-height:1.7}.mb .row button{flex:1}
@media(min-width:760px){
  .tabs{display:flex}.tact{margin-inline-start:0}nav{display:none}body{padding-bottom:30px}
  .stats{grid-template-columns:repeat(4,1fr)}
  .grid2{grid-template-columns:1fr 1fr;align-items:start}
  .dg{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
<defs>
<symbol id="home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
<symbol id="users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 4.7a3.5 3.5 0 0 1 0 6.6M18 14.3c2.2.6 3.5 2.5 3.5 5.7"/></symbol>
<symbol id="paste" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 11h6M9 15h6"/></symbol>
<symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></symbol>
<symbol id="frame" viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M4 12h16"/></symbol>
<symbol id="box" viewBox="0 0 24 24"><path d="m3.5 7.5 8.5-4.5 8.5 4.5v9L12 21l-8.5-4.5zM3.5 7.5 12 12l8.5-4.5M12 12v9"/></symbol>
<symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></symbol>
<symbol id="check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16 9.5"/></symbol>
<symbol id="x" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/></symbol>
<symbol id="warn" viewBox="0 0 24 24"><path d="M12 4 2.5 20h19zM12 10v4.5M12 17.5v.1"/></symbol>
<symbol id="trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
<symbol id="wa" viewBox="0 0 24 24"><path d="M3 21l1.6-4.7A8.5 8.5 0 1 1 8 19.5zM9 9c0 3 3 6 6 6l1.3-1.5-2-1-1 .7c-.8-.4-1.6-1.2-2-2l.7-1-1-2z"/></symbol>
<symbol id="cam" viewBox="0 0 24 24"><path d="M4 8h3l1.6-2.5h6.8L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.6"/></symbol>
<symbol id="edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/></symbol>
<symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
<symbol id="dl" viewBox="0 0 24 24"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></symbol>
<symbol id="ul" viewBox="0 0 24 24"><path d="M12 20V9m0 0-4 4m4-4 4 4M5 4h14"/></symbol>
</defs></svg>

<div class="top"><div class="in">
  <div class="brand"><div class="lg"><svg class="i"><use href="#box"/></svg></div>نظام إرجاع الطلبيات</div>
  <div class="tabs">
    <a class="on" data-p="home" onclick="go('home')"><svg class="i"><use href="#home"/></svg>الرئيسية</a>
    <a data-p="dist" onclick="go('dist')"><svg class="i"><use href="#users"/></svg>الموزعون</a>
    <a data-p="paste" onclick="go('paste')"><svg class="i"><use href="#paste"/></svg>إدخال الكودات</a>
  </div>
  <div class="tact">
    <button class="tb2" aria-label="بحث" onclick="toggleSearch()"><svg class="i"><use href="#search"/></svg></button>
    <button class="tb2 pri" aria-label="صكان" id="rb" onclick="toggleRP()"><svg class="i"><use href="#cam"/></svg></button>
  </div>
</div>
<div id="rp"><div class="rpi">
  <div class="row"><button onclick="rpScan()"><svg class="i"><use href="#cam"/></svg>صكان</button>
  <button class="o" onclick="rpManual()"><svg class="i"><use href="#edit"/></svg>إدخال يدوي</button></div>
  <div class="hide" id="rpm" style="margin-top:10px">
    <textarea id="rc" spellcheck="false" autocapitalize="off" aria-label="الكودات" style="min-height:96px" oninput="rpCount()"></textarea>
    <div class="row" style="margin-top:10px;align-items:center"><span class="mu2" id="rn" style="flex:1;margin:0">0</span>
    <button class="ok" style="flex:none" onclick="rpSubmit()">تأكيد الإرجاع</button></div>
    <div id="rr"></div>
  </div>
</div></div></div>

<div id="md"><div class="mb"><p id="mt"></p><input id="mi" class="hide" autocomplete="off"><div class="row" style="margin-top:14px"><button class="o" onclick="dlgClose()">إلغاء</button><button id="mo">تأكيد</button></div></div></div>

<div id="toast"><svg class="i" id="tI"><use href="#check"/></svg><span id="tM"></span></div>

<main>
<!-- الرئيسية -->
<section class="page on" id="p-home">
  <div class="card hide" id="sbox">
    <label for="q">كود الطلبية</label>
    <div class="row"><input id="q" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="o ic2" aria-label="صكان" onclick="openScan('search')"><svg class="i"><use href="#cam"/></svg></button>
    <button onclick="doSearch()">بحث</button></div>
    <div id="qres"></div>
  </div>

  <div class="stats">
    <div class="st" style="--c:var(--pr)"><div class="l">الطلبيات المسلمة</div><div class="v" id="tTotal">0</div></div>
    <div class="st" style="--c:var(--ok)"><div class="l">الطلبيات ليفري</div><div class="v" id="tLiv">0</div></div>
    <div class="st" style="--c:var(--wr)"><div class="l">الطلبيات روتور</div><div class="v" id="tRet">0</div></div>
    <div class="st" style="--c:var(--er)"><div class="l">الباقي عند الموزعين</div><div class="v" id="tRem">0</div></div>
  </div>

  <div class="card">
    <h3><svg class="i"><use href="#clock"/></svg>الطلبيات المتأخرة</h3>
    <div id="lateList"></div>
  </div>
</section>

<!-- الموزعون -->
<section class="page" id="p-dist">
  <div class="ttl"><h2>الموزعون</h2><button onclick="toggleAdd()"><svg class="i"><use href="#plus"/></svg>إضافة موزع جديد</button></div>
  <div class="card hide" id="addc">
    <label for="dn">اسم الموزع</label>
    <div class="row"><input id="dn" autocomplete="off"><button onclick="addDist()"><svg class="i"><use href="#plus"/></svg>إضافة</button></div>
  </div>
  <div class="dg" id="dgrid"></div>
</section>

<!-- إدخال الكودات -->
<section class="page" id="p-paste">
  <div class="ttl"><h2>إدخال الكودات</h2></div>
  <div class="grid2">
    <div class="card">
      <h3><svg class="i"><use href="#ul"/></svg>تسليم طلبيات لموزع</h3>
      <label for="pd">الموزع</label>
      <select id="pd"></select>
      <label for="pc" style="margin-top:12px">الكودات</label>
      <textarea id="pc" spellcheck="false"></textarea>
      <button style="width:100%;margin-top:12px" onclick="assign()">تسجيل التسليم</button>
    </div>
    <div class="card">
      <h3><svg class="i"><use href="#check"/></svg>طلبيات ليفري</h3>
      <label for="lc">الكودات</label>
      <textarea id="lc" spellcheck="false"></textarea>
      <button class="ok" style="width:100%;margin-top:12px" onclick="delivered()">تأكيد الليفري</button>
    </div>
  </div>
  <div class="card">
    <h3><svg class="i"><use href="#dl"/></svg>البيانات</h3>
    <div class="row" style="flex-wrap:wrap">
      <button class="o" onclick="exp()">تصدير نسخة</button>
      <button class="o" onclick="document.getElementById('imp').click()">استيراد نسخة</button>
      <button class="er" onclick="resetAll()">مسح البيانات</button>
    </div>
    <input type="file" id="imp" accept=".json" class="hide" onchange="imp(event)">
  </div>
</section>
</main>

<div id="sov">
  <div class="sh"><span id="sh">صكان الطلبيات الراجعة</span><button class="ic" onclick="closeScan()"><svg class="i"><use href="#close"/></svg></button></div>
  <div id="rd"></div>
  <div id="sm"></div>
</div>

<nav>
  <a class="on" data-p="home" onclick="go('home')"><svg class="i"><use href="#home"/></svg>الرئيسية</a>
  <a data-p="dist" onclick="go('dist')"><svg class="i"><use href="#users"/></svg>الموزعون</a>
  <a data-p="paste" onclick="go('paste')"><svg class="i"><use href="#paste"/></svg>إدخال الكودات</a>
</nav>

<script>
const K='retourSys1',DAY=864e5;
let S=load();
function load(){try{const x=JSON.parse(localStorage.getItem(K));if(x&&x.o&&x.d)return{d:x.d.map(a=>({n:a.n})),o:x.o}}catch(e){}return{d:[],o:{}}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
const $=id=>document.getElementById(id);
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()};
const parse=t=>[...new Set(t.split(/[\s,;]+/).map(x=>x.trim()).filter(Boolean))];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=(a,b)=>b?Math.round(a*100/b):0;
const ic=n=>`<svg class="i"><use href="#${n}"/></svg>`;

function go(p){
  document.querySelectorAll('.page').forEach(e=>e.classList.toggle('on',e.id==='p-'+p));
  document.querySelectorAll('[data-p]').forEach(e=>e.classList.toggle('on',e.dataset.p===p));
  window.scrollTo(0,0);render();
}
function toggleSearch(){
  if(!$('p-home').classList.contains('on')){go('home');$('sbox').classList.add('hide')}
  const b=$('sbox');b.classList.toggle('hide');
  window.scrollTo(0,0);
  if(!b.classList.contains('hide'))$('q').focus();
}

/* صوت وإشعار */
let AC;
function beep(type){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const seq=type==='ok'?[[880,.12],[1320,.16]]:type==='wr'?[[620,.22]]:[[210,.3],[150,.35]];
    let t=AC.currentTime;
    seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();
      o.type=type==='ok'?'sine':'square';o.frequency.value=f;g.gain.value=.22;
      o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);t+=d});
  }catch(e){}
  try{navigator.vibrate&&navigator.vibrate(type==='ok'?70:[180,70,180])}catch(e){}
}
const COL={ok:'#059669',wr:'#d97706',er:'#dc2626'},ICN={ok:'check',wr:'warn',er:'x'};
let tt;
function notify(type,msg){
  beep(type);
  const t=$('toast');t.style.setProperty('--c',COL[type]);
  $('tI').innerHTML=`<use href="#${ICN[type]}"/>`;$('tM').textContent=msg;
  t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2300);
}

/* الإرجاع */
function doReturn(code){
  const o=S.o[code];
  if(!o){notify('er','الكود غير موجود: '+code);return 'er'}
  if(o.s==='r'){notify('wr','تم إرجاعه سابقا · '+o.d);return 'wr'}
  if(o.s==='l'){notify('er','طلبية ليفري عند '+o.d);return 'er'}
  o.s='r';o.rt=Date.now();save();
  notify('ok','تم الإرجاع · '+o.d);render();return 'ok';
}

/* لوحة الإرجاع (الشريط العلوي) */
function toggleRP(){
  const on=$('rp').classList.toggle('on');
  $('rb').classList.toggle('act',on);
  if(!on){$('rpm').classList.add('hide');$('rr').innerHTML=''}
}
function closeRP(){$('rp').classList.remove('on');$('rb').classList.remove('act');$('rpm').classList.add('hide');$('rr').innerHTML=''}
function rpScan(){closeRP();openScan('ret')}
function rpManual(){$('rpm').classList.remove('hide');rpCount();$('rc').focus()}
function rpCount(){const n=parse($('rc').value).length;$('rn').textContent='عدد الكودات: '+n}
function retQuiet(c){
  const o=S.o[c];if(!o)return 'nf';if(o.s==='r')return 'dup';if(o.s==='l')return 'lv';
  o.s='r';o.rt=Date.now();return 'ok';
}
function rpSubmit(){
  const i=$('rc'),codes=parse(i.value);if(!codes.length)return;
  if(codes.length===1){$('rr').innerHTML='';doReturn(codes[0]);i.value='';rpCount();i.focus();return}
  const g={ok:[],dup:[],lv:[],nf:[]};
  codes.forEach(c=>g[retQuiet(c)].push(c));
  save();render();
  const T=[['ok','تم إرجاعها','var(--ok)'],['dup','سبق إرجاعها','var(--wr)'],['lv','ليفري','#60a5fa'],['nf','غير موجودة','var(--er)']];
  let h='<div class="bars" style="grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px">'+T.map(([k,t,c])=>`<div class="nums" style="display:block"><div><b style="color:${c}">${g[k].length}</b><span>${t}</span></div></div>`).join('')+'</div>';
  T.slice(1).forEach(([k,t,c])=>{if(g[k].length)h+=`<details open><summary style="color:${c}">${t} (${g[k].length})</summary><div class="codes">${g[k].map(esc).join('<br>')}</div></details>`});
  $('rr').innerHTML=h;
  i.value='';rpCount();
  const bad=codes.length-g.ok.length;
  notify(!g.ok.length?'er':bad?'wr':'ok',g.ok.length+' من '+codes.length+' تم إرجاعها');
}
/* البحث */
function doSearch(){
  const c=$('q').value.trim(),r=$('qres');if(!c)return;
  const o=S.o[c];
  if(!o){r.innerHTML=`<div class="res er"><b>الكود غير موجود</b></div>`;beep('er');return}
  const st={o:'عند الموزع',r:'تم إرجاعه',l:'ليفري'}[o.s],k={o:'wr',r:'ok',l:'ok'}[o.s];
  const days=Math.floor((today()-o.t)/DAY);
  r.innerHTML=`<div class="res ${k}"><dl><dt>الكود</dt><dd style="direction:ltr;text-align:right">${esc(c)}</dd><dt>الموزع</dt><dd>${esc(o.d)}</dd><dt>الحالة</dt><dd>${st}</dd><dt>مدة التسليم</dt><dd>${days} يوم</dd></dl>
  ${o.s==='o'?`<button class="ok" style="width:100%" data-c="${esc(c)}" onclick="confirmRet(this.dataset.c)">${ic('check')}تأكيد الإرجاع</button>`:''}</div>`;
  beep(o.s==='o'?'wr':'ok');
}
function confirmRet(c){doReturn(c);$('q').value='';$('qres').innerHTML='';$('q').focus()}
document.addEventListener('DOMContentLoaded',()=>{
  $('rc').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();rpSubmit()}});
  $('q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();doSearch()}});
  $('dn').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addDist()}});
});

/* صكان الكاميرا */
let H5,NV=null,NT=null,last='',lastT=0,mode='ret';
function scanFail(msg){
  $('rd').innerHTML='<div class="sf">'+ic('warn')+'<p>'+esc(msg)+'</p><button onclick="openScan(mode)">إعادة المحاولة</button></div>';
  beep('er');
}
function onCode(txt){
  const now=Date.now();txt=String(txt).trim();
  if(!txt||(txt===last&&now-lastT<2500))return;
  last=txt;lastT=now;
  if(mode==='search'){closeScan();go('home');$('sbox').classList.remove('hide');$('q').value=txt;doSearch();return}
  const r=doReturn(txt),m=$('sm');
  m.innerHTML=ic({ok:'check',wr:'warn',er:'x'}[r])+esc(txt);
  m.style.color={ok:'#34d399',wr:'#fbbf24',er:'#f87171'}[r];
}
function errMsg(e){
  const n=e&&(e.name||e.message||String(e));
  if(/NotAllowed|Permission/i.test(n))return 'تم رفض إذن الكاميرا. فعّله من إعدادات المتصفح ثم أعد المحاولة.';
  if(/NotFound|Overconstrained/i.test(n))return 'لم يتم العثور على كاميرا في هذا الجهاز.';
  if(/NotReadable|TrackStart/i.test(n))return 'الكاميرا مستعملة من تطبيق آخر. أغلقه وأعد المحاولة.';
  return 'تعذر تشغيل الكاميرا.';
}
async function openScan(m){
  mode=m||'ret';
  await stopScan();
  $('sov').classList.add('on');$('sm').textContent='';$('rd').innerHTML='';
  $('sh').textContent=mode==='search'?'بحث بالصكان':'صكان الطلبيات الراجعة';
  if(!window.isSecureContext){scanFail('الكاميرا تحتاج رابطا آمنا (https). افتح النظام من GitHub Pages أو أي رابط https.');return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){scanFail('هذا المتصفح لا يدعم الكاميرا.');return}
  if(window.Html5Qrcode){
    try{
      H5=new Html5Qrcode('rd');
      await H5.start({facingMode:'environment'},{fps:12,qrbox:(w,h)=>{const x=Math.min(w,h);return{width:Math.round(Math.min(w*.85,320)),height:Math.round(Math.min(x*.5,170))}}},onCode,()=>{});
    }catch(e){H5=null;scanFail(errMsg(e))}
  }else if('BarcodeDetector' in window){
    try{
      const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
      const v=document.createElement('video');v.setAttribute('playsinline','');v.muted=true;v.srcObject=st;
      $('rd').appendChild(v);await v.play();
      const det=new BarcodeDetector();NV=st;
      NT=setInterval(async()=>{try{const c=await det.detect(v);if(c.length)onCode(c[0].rawValue)}catch(_){}},250);
    }catch(e){scanFail(errMsg(e))}
  }else scanFail('تعذر تحميل مكتبة الصكان. تحقق من الإنترنت ثم أعد المحاولة.');
}
async function stopScan(){
  if(NT){clearInterval(NT);NT=null}
  if(NV){NV.getTracks().forEach(t=>t.stop());NV=null}
  if(H5){const h=H5;H5=null;try{await h.stop()}catch(e){}try{h.clear()}catch(e){}}
}
function closeScan(){$('sov').classList.remove('on');stopScan()}

/* حسابات */
function stats(){
  const v=Object.values(S.o),tot=v.length,l=v.filter(x=>x.s==='l').length,r=v.filter(x=>x.s==='r').length;
  return{tot,l,r,rem:tot-l-r};
}
function dstats(n){
  const v=Object.values(S.o).filter(x=>x.d===n),l=v.filter(x=>x.s==='l').length,r=v.filter(x=>x.s==='r').length;
  return{tot:v.length,l,r,rem:v.length-l-r};
}
function lateOf(n){
  const lim=today()-3*DAY;
  return Object.entries(S.o).filter(([c,x])=>x.d===n&&x.s==='o'&&x.t<=lim).map(([c])=>c);
}

function fmtDay(t){
  try{return new Date(t).toLocaleDateString('ar-MA-u-nu-latn',{weekday:'long',day:'numeric',month:'long'})}
  catch(e){return new Date(t).toLocaleDateString()}
}
/* العرض */
function render(){
  const s=stats();
  $('tTotal').textContent=s.tot;
  $('tLiv').textContent=s.l;
  $('tRet').textContent=s.r;
  $('tRem').textContent=s.rem;
  let rows='';
  S.d.forEach(d=>{const L=lateOf(d.n);if(L.length)rows+=`<details class="ld"><summary><b>${esc(d.n)}</b><span class="pill">${L.length}</span>
    <button class="wa sm" data-n="${esc(d.n)}" onclick="event.preventDefault();event.stopPropagation();share(this.dataset.n)">${ic('wa')}مشاركة</button></summary>
    <div class="codes">${L.map(esc).join('<br>')}</div></details>`});
  $('lateList').innerHTML=rows||'<div class="empty">لا توجد طلبيات متأخرة</div>';
  $('dgrid').innerHTML=S.d.map(d=>{
    const x=dstats(d.n),L=lateOf(d.n),lv=pct(x.l,x.tot),rt=pct(x.r,x.tot);
    const pend=Object.entries(S.o).filter(([c,o])=>o.d===d.n&&o.s==='o').map(([c])=>c);
    const G={};Object.entries(S.o).forEach(([c,o])=>{if(o.d!==d.n)return;const g=G[o.t]=G[o.t]||{sent:0,rem:[]};g.sent++;if(o.s==='o')g.rem.push(c)});
    const lim=today()-3*DAY;
    const dh=Object.keys(G).map(Number).filter(k=>G[k].rem.length).sort((a,b)=>a-b).map(k=>{const g=G[k],late=k<=lim;
      return `<details class="dd${late?' lt':''}"><summary><span>${fmtDay(k)}</span><span class="dm">${g.sent} خرجت · <b>${g.rem.length}</b> باقي${late?' <i>متأخرة</i>':''}</span></summary><div class="codes">${g.rem.map(esc).join('<br>')}</div></details>`}).join('');
    return `<div class="dc"><div class="dh"><b><span class="av">${esc(d.n.trim().charAt(0))}</span>${esc(d.n)}</b>
    <span class="dbt">${L.length?`<button class="ic wa2" data-n="${esc(d.n)}" onclick="share(this.dataset.n)">${ic('wa')}</button>`:''}
    <button class="ic" data-n="${esc(d.n)}" onclick="renDist(this.dataset.n)">${ic('edit')}</button>
    <button class="ic" data-n="${esc(d.n)}" onclick="delDist(this.dataset.n)">${ic('trash')}</button></span></div>
    <div class="nums"><div><b>${x.tot}</b><span>المسلّمة</span></div><div><b style="color:var(--wr)">${x.r}</b><span>روتور</span></div>
    <div><b style="color:var(--ok)">${x.l}</b><span>ليفري</span></div><div><b style="color:var(--er)">${x.rem}</b><span>الباقي</span></div></div>
    <div class="bars"><div><div class="pm"><span>ليفري</span><b>${lv}%</b></div><div class="pg"><i style="width:${lv}%;background:var(--ok)"></i></div></div>
    <div><div class="pm"><span>روتور</span><b>${rt}%</b></div><div class="pg"><i style="width:${rt}%;background:var(--wr)"></i></div></div></div>
    ${L.length?`<div class="mu2">متأخرة: <b>${L.length}</b></div>`:''}
    ${pend.length?`<details><summary>الكودات الخارجة (${pend.length})</summary>${dh}</details>`:''}</div>`}).join('');
  const sel=$('pd'),cur=sel.value;
  sel.innerHTML='<option value="">اختيار الموزع</option>'+S.d.map(d=>`<option>${esc(d.n)}</option>`).join('');
  sel.value=cur;
}

/* نافذة التأكيد */
let dcb=null;
function dlg(msg,cb,o){
  o=o||{};dcb=cb;$('mt').textContent=msg;
  const i=$('mi');i.classList.toggle('hide',!o.input);i.value=o.val||'';
  const b=$('mo');b.textContent=o.ok||'تأكيد';b.className=o.danger?'er':'';
  $('md').classList.add('on');if(o.input)setTimeout(()=>i.focus(),50);
}
function dlgClose(){$('md').classList.remove('on');dcb=null}
document.addEventListener('DOMContentLoaded',()=>{
  $('mo').addEventListener('click',()=>{const f=dcb,v=$('mi').value;dlgClose();if(f)f(v)});
  $('mi').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('mo').click()}});
});
/* الموزعون */
function toggleAdd(){
  const c=$('addc');c.classList.toggle('hide');
  if(!c.classList.contains('hide'))$('dn').focus();
}
function addDist(){
  const n=$('dn').value.trim();if(!n)return;
  if(S.d.some(d=>d.n===n)){notify('wr','الموزع موجود مسبقا');return}
  S.d.push({n});save();$('dn').value='';$('addc').classList.add('hide');render();notify('ok','تمت إضافة '+n);
}
function renDist(n){
  dlg('اسم الموزع الجديد',v=>{
    const m=v.trim();if(!m||m===n)return;
    if(S.d.some(d=>d.n===m)){notify('wr','الاسم موجود مسبقا');return}
    S.d.forEach(d=>{if(d.n===n)d.n=m});
    Object.values(S.o).forEach(o=>{if(o.d===n)o.d=m});
    save();render();notify('ok','تم تغيير الاسم');
  },{input:1,val:n,ok:'حفظ'});
}
function delDist(n){
  const c=Object.values(S.o).filter(o=>o.d===n).length;
  dlg('حذف الموزع '+n+(c?' وجميع طلبياته ('+c+')':'')+' ؟',()=>{
    S.d=S.d.filter(d=>d.n!==n);
    Object.keys(S.o).forEach(k=>{if(S.o[k].d===n)delete S.o[k]});
    save();render();
  },{danger:1,ok:'حذف'});
}

/* إدخال الكودات */
function assign(){
  const n=$('pd').value,codes=parse($('pc').value);
  if(!n){notify('er','اختر الموزع');return}
  if(!codes.length){notify('er','لا توجد كودات');return}
  let add=0,mv=0,skip=0;
  codes.forEach(c=>{const o=S.o[c];
    if(!o){S.o[c]={d:n,t:today(),s:'o'};add++}
    else if(o.s==='o'){o.d=n;o.t=today();mv++}
    else skip++});
  save();$('pc').value='';render();
  notify('ok',(add+mv)+' طلبية سُجلت على '+n+(skip?' · '+skip+' متجاهلة':''));
}
function delivered(){
  const codes=parse($('lc').value);
  if(!codes.length){notify('er','لا توجد كودات');return}
  let ok=0,no=0;
  codes.forEach(c=>{const o=S.o[c];if(o&&o.s==='o'){o.s='l';o.lt=Date.now();ok++}else no++});
  save();$('lc').value='';render();
  notify(ok?'ok':'er',ok+' طلبية ليفري'+(no?' · '+no+' غير صالحة':''));
}

/* واتساب */
function share(n){
  const L=lateOf(n);if(!L.length)return;
  const msg='السلام عليكم '+n+'،\nلديك '+L.length+' طلبيات متأخرة، المرجو إرجاعها و شكرا:\n\n'+L.join('\n');
  window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
}

/* البيانات */
function exp(){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));
  a.download='retours-'+new Date().toISOString().slice(0,10)+'.json';a.click();
}
function imp(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.o||!x.d)throw 0;S={d:x.d.map(a=>({n:a.n})),o:x.o};save();render();notify('ok','تم الاستيراد')}catch(_){notify('er','ملف غير صالح')}};
  r.readAsText(f);e.target.value='';
}
function resetAll(){
  dlg('مسح جميع البيانات نهائيا؟',()=>{
    S={d:[],o:{}};
    try{localStorage.removeItem(K)}catch(e){}
    render();notify('ok','تم مسح البيانات');
  },{danger:1,ok:'مسح'});
}
render();
if('serviceWorker' in navigator){
  addEventListener('load',()=>{
    const had=!!navigator.serviceWorker.controller;let rl=false;
    navigator.serviceWorker.register('sw.js').catch(()=>{});
    navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!rl){rl=true;location.reload()}});
  });
}
</script>
